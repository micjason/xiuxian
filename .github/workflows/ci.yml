name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiuxian
          POSTGRES_PASSWORD: xiuxian
          POSTGRES_DB: xiuxian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiuxian -d xiuxian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://xiuxian:xiuxian@127.0.0.1:5432/xiuxian_test
      PUBLIC_BASE_URL: http://127.0.0.1:8080
      APK_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run lint
      - run: npm run build
